name: Android · identidad del aviso entregado
on:
  pull_request:
    paths: ['tests/android-notification-identity.mjs', '.github/workflows/android-notification-identity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verified-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false playwright
      - uses: actions/download-artifact@v4
        with:
          name: tikitaka-android-avisos
          path: delivery
          run-id: 40897904485
          github-token: ${{ github.token }}
      - name: Habilitar virtualización
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell cmd uimode night yes
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell 'echo "chrome --disable-fre --no-default-browser-check --remote-debugging-port=9222" > /data/local/tmp/chrome-command-line'
            adb shell pm grant com.android.chrome android.permission.POST_NOTIFICATIONS
            adb install delivery/TikiTaka-Android-Avisos.apk
            adb shell pm grant es.tikitaka.club.avisos android.permission.POST_NOTIFICATIONS
            adb forward tcp:9222 localabstract:chrome_devtools_remote
            adb shell am start -n es.tikitaka.club.avisos/.MainActivity
            TIKITAKA_REQUIRE_APP_NOTIFICATION=1 node native/android-push/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-notification-identity-proof
          path: |
            android-push-light-login.png
            android-push-check.json
            android-notification-owner.json
