name: Android · APK con avisos

on:
  pull_request:
    paths:
      - 'native/android-push/**'
      - '.github/workflows/android-push.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar SDK e icono
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          mkdir -p native/android-push/app/src/main/res/mipmap-xxxhdpi
          cp icons/icon-512.png native/android-push/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Compilar APK con avisos
        working-directory: native/android-push
        run: gradle --no-daemon assembleDebug
      - name: Verificar firma y preparar entrega
        run: |
          mkdir -p delivery
          cp native/android-push/app/build/outputs/apk/debug/app-debug.apk delivery/TikiTaka-Android-Avisos.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/TikiTaka-Android-Avisos.apk > delivery/certificate.txt
          sha256sum delivery/TikiTaka-Android-Avisos.apk > delivery/SHA256SUMS.txt
          python3 - <<'PY'
          import json,re,pathlib
          cert=pathlib.Path('delivery/certificate.txt').read_text()
          sha=re.search(r'certificate SHA-256 digest: ([0-9a-fA-F]{64})',cert).group(1).upper()
          fingerprint=':'.join(sha[i:i+2] for i in range(0,64,2))
          entry={'relation':['delegate_permission/common.handle_all_urls'],'target':{'namespace':'android_app','package_name':'es.tikitaka.club.avisos','sha256_cert_fingerprints':[fingerprint]}}
          pathlib.Path('delivery/assetlinks-entry.json').write_text(json.dumps(entry,indent=2)+'\n')
          PY
          printf 'Tiki Taka Avisos\nAndroid 8 o superior y Chrome actualizado.\nActivar avisos desde Mi bar, Mi cuenta.\nLa asociación de dominio debe publicarse para pantalla completa y delegación.\nFuente: %s\n' "$(git rev-parse HEAD)" > delivery/LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tikitaka-android-avisos
          path: delivery/

  push-device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false playwright
      - uses: actions/download-artifact@v4
        with:
          name: tikitaka-android-avisos
          path: delivery
      - name: Habilitar virtualización
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell cmd uimode night yes
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell 'echo "chrome --disable-fre --no-default-browser-check --remote-debugging-port=9222" > /data/local/tmp/chrome-command-line'
            adb shell pm grant com.android.chrome android.permission.POST_NOTIFICATIONS
            adb install delivery/TikiTaka-Android-Avisos.apk
            adb shell pm grant es.tikitaka.club.avisos android.permission.POST_NOTIFICATIONS
            adb forward tcp:9222 localabstract:chrome_devtools_remote
            adb shell am start -n es.tikitaka.club.avisos/.MainActivity
            node native/android-push/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-push-proof
          path: |
            android-push-light-login.png
            android-push-check.json
