name: Calidad

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar JavaScript
        run: |
          node --check assets/app.js
          node --check assets/club.js
          node --check assets/surveys.js
          node --check assets/reward-images.js
      - name: Validar estructura y reglas críticas
        run: node tests/quality.mjs
      - name: Comprobar diferencias
        run: git diff --check
      - name: Validar imágenes del catálogo y control desde el admin
        run: node tests/reward-images.mjs
      - name: Validar tiradas diarias y configuración de ruleta
        run: node tests/game-sync.mjs
      - name: Validar diagnóstico de encuestas sin activar
        run: node tests/surveys-errors.mjs
      - name: Validar diagnósticos de errores de ruleta
        run: node tests/roulette-errors.mjs
      - name: Validar débito y premio de ruleta
        run: node tests/roulette-accounting.mjs
      - name: Validar lista de clientes del admin
        run: node tests/admin-users.mjs
      - name: Validar controles demo
        run: node tests/demo-controls.mjs
      - name: Validar guardado y activación de imágenes del admin
        run: node tests/theme-assets.mjs
      - name: Validar errores concretos al publicar
        run: node tests/publish-errors.mjs

  database-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      TIKITAKA_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar base de datos desechable
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Probar límite diario y publicación de ruleta
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/game_rules.sql
      - name: Probar dos dispositivos simultáneos para la misma cuenta
        run: node tests/multidevice.mjs
      - name: Probar desactivación de clientes sin pérdida de historial
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/admin_users.sql
      - name: Probar encuestas privadas, destinatarios y respuestas
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/surveys.sql
      - name: Probar respuesta simultánea desde dos dispositivos
        run: node tests/surveys-concurrency.mjs
      - name: Probar tiradas ganadas de ruleta sin límite diario antiguo
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/roulette_credits.sql
      - name: Probar dos dispositivos con una sola tirada de ruleta
        run: node tests/roulette-concurrency.mjs
      - name: Probar controles demo y aislamiento de clientes
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/demo_controls.sql

  mobile-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Probar carrusel táctil y catálogo móvil
        run: node tests/goal-browser.mjs
      - name: Probar fallos y sincronización de ruleta en móvil
        run: node tests/roulette-errors-browser.mjs
      - name: Probar encuestas en admin e Inicio
        run: node tests/surveys-browser.mjs
      - name: Probar aspecto y controles del admin en móvil y escritorio
        run: node tests/admin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-rewards
          path: test-results/
