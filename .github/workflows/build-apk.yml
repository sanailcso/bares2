# Compila el APK de Tiki Taka en la nube (GitHub Actions).
#
# Colocar en el repo bares2 como:  .github/workflows/build-apk.yml
#
# Requiere 3 secrets en el repo (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64   -> el android.keystore codificado en base64
#   KEYSTORE_PASSWORD -> contraseña nueva y robusta
#   KEY_PASSWORD      -> contraseña nueva y robusta
#
# Solo se lanza a mano. No lo ejecutes hasta rotar la clave y los tres secrets.

name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Aceptar las licencias del SDK
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      # Sin esto, Bubblewrap pregunta si instala el SDK y el job muere.
      - name: Configurar Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Preparar la carpeta de compilacion
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Falta KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Falta KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Falta KEY_PASSWORD"; exit 1; }
          mkdir -p build
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > build/android.keystore
          keytool -list -keystore build/android.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null
          cp twa/twa-manifest.json build/twa-manifest.json
          ls -la build

      # Nada de "bubblewrap init": es interactivo y no hay forma fiable de
      # contestarlo. Con el twa-manifest.json delante, "build" detecta que no
      # hay proyecto y se ofrece a generarlo. Le decimos que si (y).
      - name: Generar el proyecto y compilar el APK
        working-directory: build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          si() { printf 'y\n%.0s' $(seq 1 60); }

          echo "===== Intento 1: build regenerando el proyecto ====="
          si | timeout 1800 bubblewrap build --skipPwaValidation --skipVersionUpgrade
          echo "--- contenido tras el intento 1 ---"
          ls -la

          if [ ! -f app-release-signed.apk ]; then
            echo "===== Intento 2: update para crear el proyecto y luego build ====="
            si | timeout 900 bubblewrap update
            echo "--- gradlew presente? ---"
            ls -la gradlew 2>/dev/null || echo "sigue sin gradlew"
            si | timeout 1800 bubblewrap build --skipPwaValidation --skipVersionUpgrade
          fi

          echo "--- resultado final ---"
          ls -la
          if [ -f app-release-signed.apk ]; then
            echo "APK GENERADO CORRECTAMENTE"
            exit 0
          fi
          echo "NO se ha generado el APK"
          exit 1

      - name: Publicar el APK como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikitaka-apk
          path: |
            build/app-release-signed.apk
            build/app-release-bundle.aab
          if-no-files-found: warn
