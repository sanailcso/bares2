name: Android · APK clara de prueba

on:
  pull_request:
    paths:
      - 'native/android-preview/**'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar icono y SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p native/android-preview/app/src/main/res/mipmap-xxxhdpi
          cp icons/icon-512.png native/android-preview/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Compilar APK instalable y pruebas Android
        working-directory: native/android-preview
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Verificar firma y preparar entrega
        run: |
          mkdir -p delivery
          cp native/android-preview/app/build/outputs/apk/debug/app-debug.apk delivery/TikiTaka-Android-Prueba.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/TikiTaka-Android-Prueba.apk
          sha256sum delivery/TikiTaka-Android-Prueba.apk > delivery/SHA256SUMS.txt
          printf 'Tiki Taka Prueba\nFirma de desarrollo, instalación independiente.\nAndroid 8.0 o superior.\nNo incluye push nativo.\nFuente: %s\n' "$(git rev-parse HEAD)" > delivery/LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tikitaka-android-preview
          path: delivery/
      - uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation
          path: native/android-preview/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  dark-device:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tikitaka-android-preview
          path: delivery
      - uses: actions/download-artifact@v4
        with:
          name: android-instrumentation
          path: tests
      - name: Habilitar virtualización
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell cmd uimode night yes
            adb install delivery/TikiTaka-Android-Prueba.apk
            adb install tests/app-debug-androidTest.apk
            adb shell am instrument -w es.tikitaka.club.preview.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
            adb pull /sdcard/Android/data/es.tikitaka.club.preview/files/android-dark-login.png android-dark-login.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-dark-device-${{ matrix.api }}
          path: |
            android-dark-login.png
            instrumentation.txt
