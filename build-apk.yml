# Compila el APK de Tiki Taka en la nube (GitHub Actions).
#
# Colocar en el repo bares2 como:  .github/workflows/build-apk.yml
#
# Requiere 3 secrets en el repo (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64   -> el android.keystore codificado en base64
#   KEYSTORE_PASSWORD -> contraseña nueva y robusta
#   KEY_PASSWORD      -> contraseña nueva y robusta
#
# Se lanza solo con cada commit, y tambien a mano desde la pestana Actions.

name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restaurar la clave de firma
        run: |
          mkdir -p build
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > build/android.keystore
          cp twa/twa-manifest.json build/twa-manifest.json

      - name: Generar el proyecto Android
        working-directory: build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes '' | bubblewrap init \
            --manifest https://sanailcso.github.io/bares2/manifest.webmanifest \
            --directory . \
            --skipPwaValidation || true
          cp ../twa/twa-manifest.json ./twa-manifest.json

      - name: Compilar el APK
        working-directory: build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tikitaka-apk
          path: |
            build/app-release-signed.apk
            build/app-release-bundle.aab
          if-no-files-found: warn
